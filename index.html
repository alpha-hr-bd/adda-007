<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADDA 007 💬</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ============================= -->
    <!-- LOGIN -->
    <!-- ============================= -->

    <section id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="logo">
                💬
            </div>

            <h1>ADDA 007</h1>

            <p>বন্ধুদের সাথে আড্ডা দাও 😎🔥</p>

            <input
                id="usernameInput"
                type="text"
                maxlength="20"
                placeholder="তোমার নাম লিখো..."
                autocomplete="off"
            >

            <button id="joinBtn">
                JOIN ADDA 🚀
            </button>

        </div>

    </section>


    <!-- ============================= -->
    <!-- CHAT APP -->
    <!-- ============================= -->

    <section id="chatApp" class="chat-app">

        <!-- HEADER -->

        <header class="chat-header">

            <div class="brand">

                <div class="brand-logo">
                    007
                </div>

                <div class="brand-info">

                    <h2>ADDA 007</h2>

                    <span>
                        <i></i>
                        LIVE CHAT
                    </span>

                </div>

            </div>

            <button
                id="logoutBtn"
                class="logout-btn"
                title="Logout"
            >
                ⇥
            </button>

        </header>


        <!-- ONLINE BAR -->

        <div class="online-bar">

            <span class="online-circle"></span>

            <span>ADDA 007 is live</span>

        </div>


        <!-- MESSAGES -->

        <main id="messages" class="messages">

            <div class="welcome-message">

                <div class="welcome-icon">
                    🎉
                </div>

                <h2>Welcome to ADDA 007</h2>

                <p>
                    বন্ধুদের সাথে গল্প শুরু করো!
                </p>

            </div>

        </main>


        <!-- TYPING AREA -->

        <footer class="chat-input-area">

            <input
                id="messageInput"
                type="text"
                maxlength="500"
                placeholder="Message লিখো..."
                autocomplete="off"
            >

            <button
                id="sendBtn"
                title="Send"
            >
                ➤
            </button>

        </footer>

    </section>


    <!-- ============================= -->
    <!-- FIREBASE / APP JS -->
    <!-- ============================= -->

    <script type="module" src="./script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADDA 007</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ================= LOGIN ================= -->

    <div id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="login-logo">
                💬
            </div>

            <h1>ADDA 007</h1>

            <p>
                Friends. Messages. Adda.
            </p>

            <input
                id="usernameInput"
                type="text"
                maxlength="20"
                placeholder="Enter your name"
                autocomplete="off"
            >

            <button id="joinBtn">
                Enter Adda
            </button>

        </div>

    </div>


    <!-- ================= CHAT APP ================= -->

    <div id="chatApp" class="chat-app">

        <!-- HEADER -->

        <header class="chat-header">

            <div class="profile-section">

                <div class="avatar">
                    A7
                </div>

                <div class="profile-info">

                    <div class="chat-title">
                        ADDA 007
                    </div>

                    <div class="chat-status">
                        <span class="status-dot"></span>
                        online
                    </div>

                </div>

            </div>


            <div class="header-actions">

                <button
                    id="searchBtn"
                    title="Search"
                >
                    🔍
                </button>

                <button
                    id="logoutBtn"
                    title="Logout"
                >
                    ⋮
                </button>

            </div>

        </header>


        <!-- SEARCH -->

        <div id="searchBox" class="search-box hidden">

            <input
                id="searchInput"
                type="text"
                placeholder="Search messages..."
            >

        </div>


        <!-- CHAT -->

        <main id="messages" class="messages">

            <div class="welcome-card">

                <div class="welcome-icon">
                    🔥
                </div>

                <h2>Welcome to ADDA 007</h2>

                <p>
                    The group chat is ready.
                </p>

                <small>
                    Messages are synced in real-time.
                </small>

            </div>

        </main>


        <!-- TYPING INDICATOR -->

        <div
            id="typingIndicator"
            class="typing-indicator hidden"
        >
            Someone is typing...
        </div>


        <!-- INPUT -->

        <footer class="message-area">

            <button
                id="emojiBtn"
                class="input-action"
                title="Emoji"
            >
                😊
            </button>


            <input
                id="messageInput"
                type="text"
                maxlength="500"
                placeholder="Type a message"
                autocomplete="off"
            >


            <button
                id="sendBtn"
                class="send-btn"
                title="Send"
            >
                ➤
            </button>

        </footer>

    </div>


    <!-- EMOJI PANEL -->

    <div
        id="emojiPanel"
        class="emoji-panel hidden"
    >

        <button>😀</button>
        <button>😂</button>
        <button>🤣</button>
        <button>😍</button>
        <button>🥰</button>
        <button>😎</button>
        <button>😭</button>
        <button>😡</button>
        <button>🤔</button>
        <button>😱</button>
        <button>🔥</button>
        <button>❤️</button>
        <button>💀</button>
        <button>👍</button>
        <button>👎</button>
        <button>🎉</button>
        <button>🚀</button>
        <button>💯</button>
        <button>😂</button>
        <button>😈</button>

    </div>


    <!-- FIREBASE -->

    <script
        type="module"
        src="./script.js">
    </script>

</body>
</html>
